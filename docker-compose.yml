version: "3.9"

# NOTE ON REDIS (removed):
# This file used to run a Redis container, gate startup on its health
# check, persist a redis_data volume, and set TOKENMIZER_STATE_BACKEND=redis
# — presenting Redis as the production state backend. It was not one.
# tokenmizer/state/backend.py has no callers anywhere in the codebase:
# get_state_backend() is never invoked, so not a single byte was ever
# written to or read from Redis. The container was pure overhead, and the
# compose file advertised horizontal-scaling readiness the code does not
# have.
#
# All durable state (graph memory, checkpoints, session ownership) is
# SQLite in the `checkpoints` volume, which is why this stack runs ONE
# worker (see the Dockerfile CMD). Redis will come back when the state
# backend actually has callers and graph persistence is multi-process
# safe — tracked as issue #27.

services:
  tokenmizer:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TOKENMIZER_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TOKENMIZER_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TOKENMIZER_GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TOKENMIZER_API_KEY=${TOKENMIZER_API_KEY:-}
      - TOKENMIZER_PROVIDER=${TOKENMIZER_PROVIDER:-anthropic}
      - TOKENMIZER_DEFAULT_MODEL=${TOKENMIZER_DEFAULT_MODEL:-claude-sonnet-4-6}
    volumes:
      - checkpoints:/app/checkpoints
    restart: unless-stopped
    # SIGTERM triggers the lifespan shutdown hook, which drains in-flight
    # background extraction and flushes every cached graph to SQLite.
    # Give it room to finish rather than losing the tail of each session.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  checkpoints:
