[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenmizer"
version = "0.4.2"
description = "Reduce AI context loss by 2x. Graph-backed checkpoint and resume for any LLM session."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shweta Mishra", url = "https://github.com/Shweta-Mishra-ai" }]
keywords = ["llm", "context", "memory", "checkpoint", "ai", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.35.0"]
gemini = ["google-generativeai>=0.7.0"]
cohere = ["cohere>=5.5.0"]

# Semantic cache (optional but recommended)
cache = ["sentence-transformers>=3.0.0", "numpy>=1.26.0"]

# File intelligence extras (better PDF/Excel support)
files = ["pypdf>=4.0.0", "openpyxl>=3.1.0"]

# ML compression (much better than heuristic-only)
compression = ["llmlingua>=0.2.0"]

# Production persistence
redis = ["redis>=5.0.0"]

# Observability
observability = ["prometheus-client>=0.20.0", "opentelemetry-sdk>=1.25.0", "opentelemetry-api>=1.25.0"]

# Development
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "anthropic>=0.30.0",
    "openai>=1.35.0",
]

# Install everything
all = [
    "tokenmizer[anthropic,openai,gemini,cohere,cache,files,compression,redis,observability]"
]

[project.scripts]
tokenmizer = "tokenmizer.cli:app"
tokenmizer-mcp = "tokenmizer.mcp.server:run_stdio_server"

[project.urls]
Homepage = "https://github.com/Shweta-Mishra-ai/tokenmizer"
Repository = "https://github.com/Shweta-Mishra-ai/tokenmizer"
Issues = "https://github.com/Shweta-Mishra-ai/tokenmizer/issues"

[tool.hatch.build.targets.wheel]
packages = ["tokenmizer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["tokenmizer"]
# Only NON-PRODUCT code is omitted. Do not add product modules here to
# inflate the number — a gamed coverage gate is worse than a low honest one.
omit = [
    "tests/*",
    "benchmarks/*",
    "examples/*",
]

[tool.coverage.report]
# Honest floor over ALL product code (previously 70, but with api/app.py,
# auth.py, providers and other core modules excluded — coverage theater).
# Single source of truth: CI matrix reads this value, no override in the
# workflow — see CHANGELOG "Honest quality gates" for why 50 (measured
# 61% at the time this was set, before the omits above were removed;
# threshold kept a margin below the honest number rather than pinned to
# it, so incidental coverage dips don't immediately red the build).
#
# FOUND DURING FINAL VALIDATION: this file was truncated mid-comment,
# with the actual `fail_under = 50` line missing entirely — the
# CHANGELOG entry documenting this decision survived, but the config
# value it describes did not. Since fail_under was never set, CI's
# "Run tests with coverage" step could never fail on low coverage
# regardless of how far it dropped — the exact kind of silently-lost
# information (a gate that looks configured in the comments but isn't
# actually enforced) this audit was tasked with finding. Restored to
# the documented value; current measured coverage is ~76%, comfortably
# above it.
fail_under = 50