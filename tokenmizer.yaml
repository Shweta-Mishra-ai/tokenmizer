# TokenMizer Configuration
# Copy this file and set your values, or use environment variables (TOKENMIZER_* prefix)
# Environment variables always override this file.

# ── Provider ─────────────────────────────────────────────────────────────────
provider: anthropic           # anthropic | openai | deepseek | mistral | gemini | grok | cohere | ollama | openrouter
default_model: claude-sonnet-4-6

# API keys — prefer env vars over this file
# anthropic_api_key: ""       # or: TOKENMIZER_ANTHROPIC_API_KEY
# openai_api_key: ""          # or: TOKENMIZER_OPENAI_API_KEY
# gemini_api_key: ""          # or: TOKENMIZER_GEMINI_API_KEY

# ── Auth ─────────────────────────────────────────────────────────────────────
# api_key: ""                 # or: TOKENMIZER_API_KEY
#                             # Empty = dev mode, no auth required
#                             # In production: set to a strong random string
#
# Each credential is a separate PRINCIPAL, and a session belongs to the
# principal that first used it — so with one key the deployment is
# single-tenant (everyone holding it shares one session namespace), and
# with several, sessions are isolated per key. See README "Session
# isolation".
# api_keys:                   # or: TOKENMIZER_API_KEYS='["k1","k2"]'
#   - "second-team-key"

# ── CORS ─────────────────────────────────────────────────────────────────────
cors_origins:
  - "http://localhost:3000"
  - "http://localhost:8000"
# Add your frontend domain in production:
#   - "https://yourdomain.com"

# ── State Backend ─────────────────────────────────────────────────────────────
# NOT WIRED UP. tokenmizer/state/backend.py has no callers, so `redis`
# changes nothing: all durable state (graph memory, checkpoints, session
# ownership) is SQLite under graph_checkpoint.storage_dir. Tracked in
# issue #27 alongside the per-row persistence needed for multi-process.
state_backend: memory         # memory (dev) | redis (accepted, unused)
# redis_url: redis://localhost:6379/0

# ── Rate limiting behind a proxy ──────────────────────────────────────────────
# Rate limits key on the connecting address. Behind a load balancer that
# is the LB, so every client shares one bucket. Enable this ONLY if a
# proxy you control overwrites X-Forwarded-For — the header is
# caller-supplied and spoofable, and trusting it otherwise hands clients
# an unlimited supply of fresh buckets.
# trust_proxy_headers: false
# trusted_proxy_hops: 1       # how many trailing XFF entries are yours

# ── Graph Memory + Checkpoints ────────────────────────────────────────────────
graph_checkpoint:
  enabled: true
  trigger_at_percent: 0.85    # checkpoint when context is 85% full
  storage_dir: ./checkpoints  # SQLite DB stored here
  max_resume_tokens: 400      # cap on standard resume block size
  use_llm_extraction: false   # true = use cheap LLM (haiku) for better accuracy
                              # costs ~$0.001 per turn, much more accurate

# ── Compression ───────────────────────────────────────────────────────────────
compression:
  enabled: true
  engine: heuristic           # heuristic (default) | llmlingua2 (better, requires extra install)
  ratio: 0.5                  # target compression ratio (0.1–1.0)
  min_tokens_to_compress: 300 # don't compress short messages

# ── Semantic Cache ────────────────────────────────────────────────────────────
cache:
  enabled: true
  similarity_threshold: 0.92  # 0.90–0.98 recommended
  ttl_seconds: 3600           # 1 hour
  max_size: 10000             # LRU eviction when full
  share_scope: session        # session (default, safe) | shared (opt-in cross-session sharing
                               # for prompts that don't look sensitive — see SECURITY.md)

# ── Terse Output ─────────────────────────────────────────────────────────────
terse_output:
  enabled: true
  level: full                 # lite | full | ultra

# ── Context Routing ───────────────────────────────────────────────────────────
# NOT IMPLEMENTED. Nothing reads these fields — setting enabled: true
# changes no behaviour and logs a warning at startup. Kept only so that
# existing config files carrying a `routing:` block still load.
routing:
  enabled: false              # has no effect

# ── Memory ───────────────────────────────────────────────────────────────────
memory:
  enabled: true
  max_tokens_before_summary: 4000
  recent_turns_verbatim: 10

# ── Server ───────────────────────────────────────────────────────────────────
# 127.0.0.1 = localhost only (safe default). Set to 0.0.0.0 to accept
# connections from other machines — only do this behind your own auth/
# network controls (see SECURITY.md). The Docker deployment (Dockerfile /
# docker-compose.yml) passes --host 0.0.0.0 explicitly and is unaffected
# by this setting either way.
proxy_host: 127.0.0.1
proxy_port: 8000
