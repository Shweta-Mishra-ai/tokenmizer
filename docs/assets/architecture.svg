  <text x="78" y="305" fill="#fde68a" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="600">Output Trimmer  +  Terse Injection</text>
  <text x="60" y="320" fill="#403010" font-family="'JetBrains Mono',monospace" font-size="7.5">Remove LLM filler · inject brevity prompt  ·  5–15% output savings  ·  zero info loss</text>

