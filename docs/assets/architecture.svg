<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" role="img" aria-labelledby="t d">
  <title id="t">TokenMizer architecture</title>
  <desc id="d">An OpenAI-compatible proxy sits between your application and any LLM. Requests pass a security gate, then six pipeline layers: file intelligence, prompt compression, terse-output injection, graph memory, semantic cache and the provider prompt cache. Graph memory reads and writes per-row SQLite storage under a cross-process lock, alongside checkpoints and session ownership. An MCP server exposes checkpoint, resume and reasoning tools to editors.</desc>

  <style>
    .bg   { fill: #0b0e14; }
    .card { fill: #11151f; stroke: #232936; stroke-width: 1.25; }
    .lane { fill: #0e121b; stroke: #1e2431; stroke-width: 1.25; }
    .acc  { fill: #151a26; stroke: #2b3242; stroke-width: 1.25; }
    .h    { fill: #e8ecf4; font: 600 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .t    { fill: #c3cbd9; font: 500 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s    { fill: #7d8798; font: 400 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tag  { fill: #0b0e14; font: 700 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .lbl  { fill: #8b94a6; font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .flow { stroke: #3d4657; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .back { stroke: #2e3546; stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; marker-end: url(#a); }
    .rw   { stroke: #5ee7c8; stroke-width: 1.6; fill: none; marker-end: url(#ag); marker-start: url(#ag); opacity: .85; }
    .sep  { stroke: #232936; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f7f8fa; } .card { fill: #ffffff; stroke: #dfe3ea; }
      .lane { fill: #f1f3f7; stroke: #dfe3ea; } .acc { fill: #eef1f6; stroke: #d5dae3; }
      .h { fill: #10131a; } .t { fill: #3d4553; } .s { fill: #6b7383; }
      .tag { fill: #ffffff; } .lbl { fill: #6b7383; } .sep { stroke: #dfe3ea; }
      .flow, .back { stroke: #aeb6c4; } .rw { stroke: #17a67f; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4657"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5ee7c8"/>
    </marker>
  </defs>

  <rect class="bg" width="940" height="620" rx="14"/>

  <!-- Client -->
  <rect class="card" x="28" y="252" width="150" height="76" rx="10"/>
  <text class="h" x="103" y="284" text-anchor="middle">Your app</text>
  <text class="s" x="103" y="303" text-anchor="middle">OpenAI-compatible</text>
  <text class="s" x="103" y="317" text-anchor="middle">client · SDK · CLI</text>

  <path class="flow" d="M178 282 L 214 282"/>
  <text class="lbl" x="196" y="274" text-anchor="middle">POST</text>
  <path class="back" d="M214 306 L 178 306"/>

  <!-- Proxy lane -->
  <rect class="lane" x="216" y="34" width="470" height="552" rx="14"/>
  <text class="h" x="236" y="62">TokenMizer proxy</text>
  <text class="s" x="236" y="80">localhost:8000 · /v1/chat/completions</text>

  <!-- Security gate -->
  <rect class="acc" x="236" y="96" width="430" height="52" rx="9"/>
  <text class="t" x="252" y="118">Security gate</text>
  <text class="s" x="252" y="136">rate limit · API key · session ownership · redaction once, at ingestion</text>

  <!-- Layers -->
  <rect class="card" x="236" y="160" width="430" height="52" rx="9"/>
  <rect x="248" y="176" width="26" height="20" rx="5" fill="#7c6af7"/>
  <text class="tag" x="261" y="190" text-anchor="middle">L0</text>
  <text class="t" x="286" y="184">File intelligence</text>
  <text class="s" x="286" y="200">CSV · PDF · Excel · JSON → schema + sample, inside a token budget</text>

  <rect class="card" x="236" y="220" width="430" height="52" rx="9"/>
  <rect x="248" y="236" width="26" height="20" rx="5" fill="#7c6af7"/>
  <text class="tag" x="261" y="250" text-anchor="middle">L1</text>
  <text class="t" x="286" y="244">Prompt compression</text>
  <text class="s" x="286" y="260">heuristic filler/dedup — fenced code passed through untouched</text>

  <rect class="card" x="236" y="280" width="430" height="46" rx="9"/>
  <rect x="248" y="293" width="26" height="20" rx="5" fill="#7c6af7"/>
  <text class="tag" x="261" y="307" text-anchor="middle">L2</text>
  <text class="t" x="286" y="301">Terse-output injection</text>
  <text class="s" x="286" y="317">system-prompt directive to cut response padding</text>

  <rect class="card" x="236" y="334" width="430" height="66" rx="9"/>
  <rect x="248" y="356" width="26" height="20" rx="5" fill="#5ee7c8"/>
  <text class="tag" x="261" y="370" text-anchor="middle">L4</text>
  <text class="t" x="286" y="356">Graph memory</text>
  <text class="s" x="286" y="372">extract nodes → smart windowing → inject relevant context</text>
  <text class="s" x="286" y="388">auto-checkpoint at trigger_at_percent, outcome returned to caller</text>

  <rect class="card" x="236" y="408" width="430" height="52" rx="9"/>
  <rect x="248" y="424" width="26" height="20" rx="5" fill="#f9d84a"/>
  <text class="tag" x="261" y="438" text-anchor="middle">L3</text>
  <text class="t" x="286" y="432">Semantic cache</text>
  <text class="s" x="286" y="448">exact + embedding match · session-scoped by default</text>

  <rect class="card" x="236" y="468" width="430" height="52" rx="9"/>
  <rect x="248" y="484" width="26" height="20" rx="5" fill="#f9d84a"/>
  <text class="tag" x="261" y="498" text-anchor="middle">L5</text>
  <text class="t" x="286" y="492">Provider prompt cache</text>
  <text class="s" x="286" y="508">Anthropic cache_control on prefixes over 1024 tokens</text>

  <text class="s" x="236" y="548">Layer numbers match the API response fields.</text>
  <text class="s" x="236" y="564">savings.routing is always 0 — model routing is not implemented.</text>

  <path class="flow" d="M451 212 L 451 218"/>
  <path class="flow" d="M451 272 L 451 278"/>
  <path class="flow" d="M451 326 L 451 332"/>
  <path class="flow" d="M451 400 L 451 406"/>
  <path class="flow" d="M451 460 L 451 466"/>

  <!-- Provider -->
  <rect class="card" x="724" y="96" width="188" height="120" rx="10"/>
  <text class="h" x="744" y="126">Any LLM</text>
  <text class="s" x="744" y="147">Claude · GPT · Gemini</text>
  <text class="s" x="744" y="164">Grok · DeepSeek · Mistral</text>
  <text class="s" x="744" y="181">Cohere · OpenRouter</text>
  <text class="s" x="744" y="198">Ollama (local)</text>
  <path class="flow" d="M666 140 L 724 140"/>
  <path class="back" d="M724 172 L 666 172"/>
  <text class="lbl" x="695" y="132" text-anchor="middle">call</text>

  <!-- Storage -->
  <rect class="card" x="724" y="300" width="188" height="180" rx="10"/>
  <text class="h" x="744" y="330">SQLite storage</text>
  <text class="s" x="744" y="349">one directory, every session</text>
  <line class="sep" x1="744" y1="360" x2="892" y2="360"/>
  <text class="t" x="744" y="381">graph_nodes</text>
  <text class="s" x="744" y="396">one row per node</text>
  <text class="t" x="744" y="416">graph_edges</text>
  <text class="s" x="744" y="431">one row per edge</text>
  <text class="t" x="744" y="451">checkpoints</text>
  <text class="t" x="744" y="471">session_owners</text>
  <path class="rw" d="M666 367 L 724 367"/>
  <text class="lbl" x="695" y="359" text-anchor="middle">per-row</text>
  <text class="lbl" x="695" y="385" text-anchor="middle">locked</text>

  <!-- MCP -->
  <rect class="card" x="724" y="500" width="188" height="86" rx="10"/>
  <text class="h" x="744" y="528">MCP server</text>
  <text class="s" x="744" y="547">checkpoint · resume · why</text>
  <text class="s" x="744" y="563">graph stats · analyze file</text>
  <text class="s" x="744" y="579">Claude Code · Cursor · Zed</text>
  <path class="rw" d="M666 520 L 724 528"/>
</svg>
