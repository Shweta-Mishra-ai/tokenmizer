  <text x="90" y="102" text-anchor="middle" fill="#6366a0" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing="1.5">CLIENT</text>
  <text x="90" y="118" text-anchor="middle" fill="#c4b5fd" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="600">Your App</text>
  <text x="90" y="129" text-anchor="middle" fill="#3d3f5a" font-family="'JetBrains Mono',monospace" font-size="7.5">OpenAI SDK / curl</text>

